<!--
  分享预览图的源文件。同一张图用在两个地方：
  - 网站的分享卡片（og:image，见 overrides/main.html），图在 docs/assets/social-preview.png
  - GitHub 仓库的 Settings → Social preview，要手动上传

  改完后用无头 Chrome 渲染成 1280×640 的 PNG：

  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
    --force-device-scale-factor=1 --window-size=1280,640 \
    --screenshot="$PWD/docs/assets/social-preview.png" "file://$PWD/.github/social-preview.html"
-->
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    position: relative;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", sans-serif;
    color: #18211c;
    background: #ffffff;
  }
  .stripe {
    position: absolute; top: 0; left: 0; width: 100%; height: 14px;
    background: linear-gradient(to right, #f2b400 0 33.34%, #0a5c3f 33.34% 66.67%, #b5202b 66.67% 100%);
  }
  .tint {
    position: absolute; right: 0; top: 14px; bottom: 0; width: 396px;
    background: #f4f6f3; border-left: 1px solid #dde3dc;
  }
  .main { position: absolute; left: 88px; top: 96px; width: 760px; }
  .label { font-size: 27px; font-weight: 600; letter-spacing: 0.06em; color: #0a5c3f; }
  h1 { margin-top: 18px; font-size: 104px; font-weight: 800; line-height: 1.12; letter-spacing: -0.01em; }
  .lead { margin-top: 26px; font-size: 31px; line-height: 1.6; color: #4a5750; }
  .facts { position: absolute; left: 88px; bottom: 72px; display: flex; gap: 14px; }
  .facts span {
    padding: 9px 22px; font-size: 25px; font-weight: 600; color: #07442f;
    background: #e7f0ea; border-radius: 999px;
  }
  .side { position: absolute; right: 0; top: 14px; bottom: 0; width: 396px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .flag { width: 196px; height: 142px; overflow: hidden; border-radius: 26px; box-shadow: 0 14px 36px rgba(24, 33, 28, 0.14); }
  .flag i { display: block; height: 33.34%; }
  .flag i:nth-child(1) { background: #f2b400; }
  .flag i:nth-child(2) { background: #0a5c3f; }
  .flag i:nth-child(3) { background: #b5202b; }
  .url { margin-top: 44px; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 26px; font-weight: 600; color: #0a5c3f; }
</style>
</head>
<body>
  <div class="stripe"></div>
  <div class="tint"></div>
  <div class="main">
    <p class="label">面向中文读者的生活参考书</p>
    <h1>立陶宛生活指南</h1>
    <p class="lead">读懂立陶宛社会，找到居留、住房、看病、上学、工作和报税的办事入口。</p>
  </div>
  <div class="facts"><span>26 章正文</span><span>9 份事项清单</span><span>3 座城市</span></div>
  <div class="side">
    <div class="flag"><i></i><i></i><i></i></div>
    <p class="url">lt.shenxianpeng.dev</p>
  </div>
</body>
</html>
