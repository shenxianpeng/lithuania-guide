site_name: 立陶宛生活指南
site_url: https://lt.shenxianpeng.dev/
site_description: 面向中文读者的立陶宛生活参考书：居留、住房、医疗、教育、工作、税务，以及日常办事的入口。
site_author: 沈显鹏
copyright: © 2026 沈显鹏 · 转载请注明作者和出处，请勿用于商业用途

docs_dir: docs
strict: true

# 断链和失效锚点在 --strict 构建时直接报错
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: sumi
  locale: zh
  # 页脚和浏览器标题的覆盖在 overrides/ 里；首页用 Sumi 的 landing.html，内容在 docs/index.md
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/logo.svg
  # 分享到 X、Telegram 等平台时的预览图，源文件是 .github/social-preview.html
  social_image: assets/social-preview.png
  # 主色、字体在 docs/assets/extra.css 里（国旗绿，系统字体）

# 给章节加页眉信息、本章要点和相关事项（读各页的 front matter）
hooks:
  - hooks/guide.py

extra:
  # 全站显示的核验时间，每次整体核对后更新
  verified: 2026 年 10 月
  verified_short: "2026-10"

extra_css:
  - assets/extra.css

extra_javascript:
  - assets/guide.js
  - assets/listen.js

plugins:
  # Sumi 的搜索自带中文分词
  - search
  - sumi

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - abbr
  - toc:
      permalink: true
      permalink_title: 本节链接
      toc_depth: 3
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      # 清单可以勾选，状态由 docs/assets/guide.js 存在浏览器里
      clickable_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.keys

# 章节标题前的两位数字是全书连续编号，和各章 front matter 里的 chapter 一致
nav:
  - 首页: index.md
  - 阅读:
      - book/index.md
      - 第一部分 认识立陶宛:
          - book/foundations/index.md
          - 01 地理、气候与城市: book/foundations/geography.md
          - 02 关键历史与社会形成: book/foundations/history.md
          - 03 国家制度与公共事务: book/foundations/government.md
          - 04 社会文化与默会知识: book/foundations/culture.md
          - 05 立陶宛与世界: book/foundations/world.md
      - 第二部分 建立日常生活:
          - book/life/index.md
          - 06 身份、居留与行政: book/life/documents.md
          - 07 住房、租赁与购房: book/life/housing.md
          - 08 衣食、购物与家庭运转: book/life/household.md
          - 09 交通、驾驶与出行: book/life/transport.md
          - 10 数字生活与通信: book/life/digital.md
          - 11 社区、文化与休闲: book/life/community.md
      - 第三部分 健康、家庭与学习:
          - book/people/index.md
          - 12 医疗与就医入口: book/people/health.md
          - 13 心理健康与无障碍: book/people/wellbeing.md
          - 14 婚姻、家庭与生育: book/people/family.md
          - 15 幼儿园与中小学: book/people/school.md
          - 16 大学与终身学习: book/people/learning.md
          - 17 立陶宛语与语言生活: book/people/language.md
          - 18 养老、父母与身后事: book/people/aging.md
      - 第四部分 工作、收入与财务:
          - book/work/index.md
          - 19 求职与职场文化: book/work/career.md
          - 20 劳动关系与社会保障: book/work/employment.md
          - 21 银行、储蓄与保险: book/work/finance.md
          - 22 个人税务与年度申报: book/work/tax.md
          - 23 创业与经营: book/work/business.md
      - 第五部分 法律、安全与户外:
          - book/rights/index.md
          - 24 权利、纠纷与求助机构: book/rights/legal.md
          - 25 公共安全与应急: book/rights/safety.md
          - 26 自然、户外与周边旅行: book/rights/outdoors.md
  - 事项:
      - routes/index.md
      - 出发前: routes/before-you-go.md
      - 抵达头 30 天: routes/arrival.md
      - 搬家: routes/moving.md
      - 入职: routes/start-work.md
      - 失业: routes/job-loss.md
      - 生病: routes/illness.md
      - 生育: routes/parenthood.md
      - 创业: routes/business.md
      - 离开立陶宛: routes/leaving.md
  - 城市:
      - cities/index.md
      - 维尔纽斯: cities/vilnius.md
      - 考纳斯: cities/kaunas.md
      - 克莱佩达: cities/klaipeda.md
  - 查询:
      - 官方入口速查: reference/links.md
      - 立陶宛语术语表: reference/glossary.md
      - 2026 年关键数字: reference/numbers.md
      - 阅读说明: reference/about.md
